name: Sample screenshots

# Runs the sample on an Android emulator, an iOS simulator and Windows, screenshots each sheet
# and commits the images to screenshots/ on the branch it was started on. A platform whose screenshots
# failed keeps its previous images. Check screenshots (alerts,
# modal pages and pickers opened from inside a sheet) go to screenshots/checks/, without thumbnails.
on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '11.0.x'
  SAMPLE: samples/Plugin.Maui.Sheet.Sample/Plugin.Maui.Sheet.Sample.csproj

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v6
        with:
          # Microsoft's OpenJDK reports a five-part version (21.0.13.0.2) that .NET for Android cannot parse (XA0033).
          distribution: temurin
          java-version: '21'
      - name: Install workload and Android SDK packages
        run: |
          dotnet workload install maui-android
          dotnet build $SAMPLE -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory=$ANDROID_HOME -p:AcceptAndroidSDKLicenses=True
      - name: Build sample
        # Embedding the assemblies makes the APK installable on its own (no fast deployment).
        run: dotnet build $SAMPLE -f net11.0-android -c Debug -p:RuntimeIdentifier=android-x64 -p:EmbedAssembliesIntoApk=true -p:AndroidSdkDirectory=$ANDROID_HOME
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/screenshots-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-android
          path: screenshots/android-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: checks-android
          path: checks/android-*.png
          if-no-files-found: ignore

  ios:
    # GitHub's Xcode 27 image (macOS 27) has several Xcode 27 versions side by side.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install workloads
        # Restore covers every target of the sample, Android included.
        run: dotnet workload restore samples/Plugin.Maui.Sheet.Sample.sln
      - name: Select the Xcode .NET for iOS was built for
        # .NET for iOS requires the exact Xcode its SDK pack names (Microsoft.iOS.Sdk.net11.0_27.2 → Xcode 27.2);
        # the image's newest Xcode can be newer. Betas are skipped. Fails if the image no longer has that version.
        run: |
          want=$(ls -d "$DOTNET_ROOT"/packs/Microsoft.iOS.Sdk.net*_* | sed 's/.*_//' | sort -V | tail -1)
          xcode=$(ls -d /Applications/Xcode_"$want"*.app | grep -v beta | sort -V | tail -1)
          echo ".NET for iOS $want -> $xcode"
          sudo xcode-select -s "$xcode"
      - name: Build sample
        run: dotnet build $SAMPLE -f net11.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
      - name: Install idb
        # Taps the overflow button for its screenshot; without idb that one screenshot is skipped.
        continue-on-error: true
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pipx install fb-idb
      - name: Screenshots
        run: bash .github/scripts/screenshots-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-ios
          path: screenshots/ios-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: checks-ios
          path: checks/ios-*.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install workloads
        run: dotnet workload restore samples/Plugin.Maui.Sheet.Sample.sln
      - name: Build sample
        # The runner has no Windows App SDK runtime installed, so the sample bundles it.
        run: dotnet build ${{ env.SAMPLE }} -f net11.0-windows10.0.19041.0 -c Debug -p:BundleWindowsAppRuntime=true
      - name: Screenshots
        shell: pwsh
        run: ./.github/scripts/screenshots-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows
          path: screenshots/windows-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: checks-windows
          path: checks/windows-*.png
          if-no-files-found: ignore

  commit:
    needs: [android, ios, windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: checks-*
          path: screenshots/checks
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Thumbnails for the README
        run: |
          pip install pillow
          python .github/scripts/screenshot-thumbnails.py
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet || { git commit -m "Update sample screenshots"; git pull --rebase; git push; }
