name: Build for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

# A newer push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '11.0.x' # The .NET SDK version to use

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI Workload
      run: dotnet workload restore samples\Plugin.Maui.Sheet.Sample.sln

    - name: Build library
      run: dotnet build src\Plugin.Maui.Sheet.sln -c Release

    - name: Test
      run: dotnet test src\Plugin.Maui.Sheet.sln -c Release --no-build

    # Reuses the library build above; only the sample itself is compiled here.
    - name: Build sample
      run: dotnet build samples\Plugin.Maui.Sheet.Sample.sln -c Release
