<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="A phone showing a bottom sheet">
  <title>Plugin.Maui.Sheet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B3FE8"/>
      <stop offset="1" stop-color="#4521B8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Phone -->
  <rect x="33" y="8" width="62" height="112" rx="13" fill="#1B1340"/>
  <!-- Page behind the sheet, dimmed -->
  <rect x="37" y="12" width="54" height="104" rx="9.5" fill="#9C8BE6"/>
  <rect x="58" y="16" width="12" height="4" rx="2" fill="#1B1340"/>
  <rect x="43" y="26" width="30" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".45"/>
  <rect x="43" y="36" width="42" height="4" rx="2" fill="#FFFFFF" fill-opacity=".3"/>
  <rect x="43" y="44" width="36" height="4" rx="2" fill="#FFFFFF" fill-opacity=".3"/>

  <!-- Bottom sheet -->
  <path d="M37 64a9 9 0 0 1 9-9h36a9 9 0 0 1 9 9v42.5a9.5 9.5 0 0 1-9.5 9.5h-35a9.5 9.5 0 0 1-9.5-9.5z" fill="#FFFFFF"/>
  <!-- Grabber -->
  <rect x="57" y="59" width="14" height="3" rx="1.5" fill="#C8C1E0"/>
  <!-- Native header: cancel, title, done -->
  <rect x="42" y="67" width="9" height="4" rx="2" fill="#9A92B8"/>
  <rect x="55" y="67" width="18" height="4" rx="2" fill="#1B1340"/>
  <rect x="77" y="66" width="10" height="6" rx="3" fill="#512BD4"/>
  <!-- Content -->
  <rect x="42" y="79" width="44" height="4" rx="2" fill="#E2DCF4"/>
  <rect x="42" y="87" width="36" height="4" rx="2" fill="#E2DCF4"/>
  <rect x="42" y="95" width="40" height="4" rx="2" fill="#E2DCF4"/>
  <rect x="42" y="103" width="28" height="4" rx="2" fill="#E2DCF4"/>
</svg>
